[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fogseg"
version = "0.1.0"
description = "Night-time fog / low stratus segmentation from Meteosat SEVIRI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "eumdac",
    "satpy",
    "pyresample",
    "pyorbital",
    "xarray",
    "netCDF4",
    "numpy",
    "pandas",
    "pyyaml",
    "scipy",
    "scikit-learn",
    "rasterio",
    "matplotlib",
    "zarr>=3",
    "cdsapi",
]

[project.optional-dependencies]
# ruff is pinned: its default rule set changes between versions, and CI must lint like local runs
dev = ["pytest", "ruff==0.17.*"]
# to run the notebooks, also headless: jupyter nbconvert --to notebook --execute --inplace <file>
notebooks = ["nbclient", "ipykernel", "jupyter"]
# the U-Net; CUDA users install torch from the PyTorch index first
model = ["torch", "mlflow"]

[project.scripts]
fogseg = "fogseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = [
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
]
