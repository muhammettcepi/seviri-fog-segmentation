[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fogseg"
version = "0.1.0"
description = "Night-time fog / low stratus segmentation from Meteosat SEVIRI"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "eumdac",
    "satpy",
    "pyresample",
    "pyorbital",
    "xarray",
    "netCDF4",
    "numpy",
    "pyyaml",
    "zarr>=3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
fogseg = "fogseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
